<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recompila: o que você quer agora?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0F1A;color:#F6F6F3;font-family:'IBM Plex Sans',system-ui,sans-serif}
a{color:#9DB0FF}
.wrap{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;max-width:1100px;width:100%;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.mark{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;background:#2F5BFF;color:#fff;border-radius:8px;padding:5px 7px}
nav.versoes{display:flex;gap:4px;padding:4px;border-radius:999px;background:#121829;border:1px solid #2A3550}
nav.versoes a{padding:8px 14px;border-radius:999px;text-decoration:none;font-size:14px;color:#C5CBD8;font-weight:500}
nav.versoes a.ativa{background:#2F5BFF;color:#fff;font-weight:600}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:24px 24px 64px;max-width:1000px;width:100%;margin:0 auto}
.orb{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#C9D4FF,#2F5BFF 55%,#1C2C7A);box-shadow:0 0 60px rgba(47,91,255,.55)}
.centro{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
h1{margin:0;font-weight:700;font-size:clamp(34px,6vw,64px);line-height:1.05;letter-spacing:-.03em}
.sub{margin:0;font-size:17px;color:#8C96AB}
.resposta{width:100%;display:flex;flex-direction:column;gap:22px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#121829;border:1px solid #222A3B;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.card .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8C96AB;text-transform:uppercase;letter-spacing:.06em}
.card .big{font-size:clamp(30px,4vw,44px);line-height:1.05;letter-spacing:-.02em;font-weight:700}
.card .small{font-size:15px;color:#C5CBD8}
.acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{text-decoration:none;font-weight:600;padding:14px 22px;border-radius:999px}
.btn.primario{background:#2F5BFF;color:#fff}
.btn.secundario{color:#F6F6F3;border:1px solid #36405A;font-weight:500}
.entrada{width:100%;max-width:720px;display:flex;flex-direction:column;gap:14px}
.campo{display:flex;align-items:center;gap:8px;background:#121829;border:1px solid #36405A;border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.campo input{flex:1;min-width:0;min-height:48px;border:none;outline:none;background:transparent;color:#F6F6F3;font-size:17px;font-family:inherit}
.campo input::placeholder{color:#6B7385}
.redondo{width:48px;height:48px;border-radius:50%;border:none;background:#2F5BFF;color:#fff;cursor:pointer;font-size:20px}
.redondo.voz{background:transparent;border:1px solid #36405A;color:#6B7385;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid #2A3550;background:transparent;color:#C5CBD8;font-size:14px;font-family:inherit;cursor:pointer}
.chip:hover{background:#1B2336;border-color:#9DB0FF}
footer{text-align:center;padding:0 24px 24px;font-size:13px;color:#6B7385}
.oculto{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <span class="brand"><span class="mark" aria-hidden="true">&gt;_</span>Recompila</span>
  <nav class="versoes" aria-label="Escolha a versão">
    <a href="index.html" class="ativa" aria-current="page"><span aria-hidden="true">●</span> Conversa</a>
    <a href="#" title="Em breve">Versão completa</a>
  </nav>
</header>

<main>
  <div class="orb" aria-hidden="true"></div>

  <div id="inicio" class="centro">
    <h1>Oi. O que você quer agora?</h1>
    <p class="sub">Tecnologia muda o tempo todo. Fala do seu jeito, eu monto o resto.</p>
  </div>

  <div id="resposta" class="resposta oculto">
    <div class="centro">
      <span class="sub" id="disse"></span>
      <h1 id="titulo"></h1>
    </div>
    <div class="grade" id="cards"></div>
    <div class="acoes">
      <a class="btn primario" id="comecar" href="#">Começar agora</a>
      <a class="btn secundario" id="detalhes" href="#">Ver os detalhes</a>
    </div>
  </div>

  <div class="entrada">
    <form class="campo" id="form">
      <input id="pedido" type="text" placeholder="Ex.: quero uma vaga, sou PM, não quero me expor..." aria-label="O que você quer?" autocomplete="off">
      <button type="button" class="redondo voz" disabled title="Voz em breve" aria-label="Falar por voz, em breve">🎙</button>
      <button type="submit" class="redondo" aria-label="Enviar">→</button>
    </form>
    <div class="chips" role="group" aria-label="Sugestões" id="chips"></div>
  </div>
</main>

<footer>Você está falando com o Boleta, uma IA. Conversa confidencial.</footer>
</div>

<script>
var INTENTS = {
  stack: { chip: 'Atualizar meu stack', titulo: 'Bora atualizar sem começar do zero.', link: '#trilhas', cards: [['Sua trilha', 'Devs', 'pontes do seu stack para o de hoje, com IA'], ['Tempo', '10 min', 'por dia, no celular'], ['Você termina com', '1 site', 'e um projeto validado']] },
  vaga: { chip: 'Quero uma vaga', titulo: 'Falta menos do que você imagina.', link: '#raiox', cards: [['Vagas analisadas', '6', 'reais, do LinkedIn'], ['O que mais pedem', 'Fundamento', 'mais do que ferramenta'], ['Seu próximo passo', 'Raio-X', 'cole uma vaga e veja os gaps']] },
  mudar: { chip: 'Mudar de área', titulo: 'Sem salto no escuro.', link: '#futuro', cards: [['Caminhos', '2', 'engenharia ou produto'], ['Antes de mudar', 'Você testa', 'nas primeiras semanas'], ['Comece por', 'Lógica + IA', 'um case simples do começo ao fim']] },
  produto: { chip: 'Sou PM, PO ou agilista', titulo: 'Método para quem já entende de produto.', link: '#pms', cards: [['Sua trilha', 'Produto', 'discovery e Event Storming'], ['Junto com', 'Os devs', 'desenhando o negócio'], ['Diferencial', 'Dizer não', 'com evidência']] },
  qa: { chip: 'Sou QA', titulo: 'De testador a dono da qualidade.', link: '#trilhas', cards: [['Sua trilha', 'Qualidade', 'automação e testes de contrato'], ['Superpoder', 'Golden Sample', 'conferir contra a fonte da verdade'], ['Com IA', 'Casos de teste', 'gerados e revisados por você']] },
  kids: { chip: 'Levar para uma escola', titulo: 'Tecnologia é brincadeira séria.', link: '#kids', cards: [['Idades', '6 a 14', 'com e sem computador'], ['Cada encontro', '50 min', 'missão, mostra e insígnia'], ['Segurança', 'Professor junto', 'sempre, sem dados de crianças']] },
  privado: { chip: 'Não quero me expor', titulo: 'Ninguém precisa saber.', link: '#privacidade', cards: [['Seu modo', 'Discreto', 'um personagem no lugar do nome'], ['Quem sabe', 'Só o mentor', 'e mais ninguém'], ['Quando quiser', 'Você apaga', 'tudo o que é seu']] }
};
var ORDEM = ['stack', 'vaga', 'mudar', 'produto', 'qa', 'kids', 'privado'];
var REGRAS = [
  ['privado', ['expor', 'anon', 'privad', 'sigil', 'escond', 'discre', 'ninguém', 'ninguem']],
  ['kids', ['kid', 'escola', 'crian', 'filho', 'filha', 'aluno']],
  ['qa', ['qa', 'teste', 'qualidade', 'tester']],
  ['produto', ['pm', 'po', 'produto', 'scrum', 'agil', 'ágil', 'discovery']],
  ['vaga', ['vaga', 'emprego', 'entrevista', 'recoloca', 'demit', 'trabalho']],
  ['mudar', ['mudar', 'trocar', 'transi', 'área', 'area', 'carreira']]
];
var CORES = ['#9DB0FF', '#7FD6A8', '#FFD166'];

function entender(t) {
  var s = ' ' + String(t || '').toLowerCase() + ' ';
  for (var i = 0; i < REGRAS.length; i++) {
    var r = REGRAS[i];
    for (var j = 0; j < r[1].length; j++) {
      var p = r[1][j];
      if (p.length <= 2 ? s.indexOf(' ' + p + ' ') >= 0 : s.indexOf(p) >= 0) { return r[0]; }
    }
  }
  return 'stack';
}

function el(id) { return document.getElementById(id); }

function mostrar(chave, frase) {
  var it = INTENTS[chave];
  el('inicio').classList.add('oculto');
  el('resposta').classList.remove('oculto');
  el('disse').textContent = 'você: “' + frase + '”';
  el('titulo').textContent = it.titulo;
  el('comecar').href = 'index.html';
  el('detalhes').href = it.link;
  var cards = el('cards');
  cards.innerHTML = '';
  it.cards.forEach(function (c, i) {
    var d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<span class="eyebrow"></span><strong class="big"></strong><span class="small"></span>';
    d.querySelector('.eyebrow').textContent = c[0];
    var big = d.querySelector('.big');
    big.textContent = c[1];
    big.style.color = CORES[i];
    d.querySelector('.small').textContent = c[2];
    cards.appendChild(d);
  });
  renderChips(chave);
}

function renderChips(atual) {
  var box = el('chips');
  box.innerHTML = '';
  ORDEM.filter(function (k) { return k !== atual; }).forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = INTENTS[k].chip;
    b.onclick = function () { mostrar(k, INTENTS[k].chip); };
    box.appendChild(b);
  });
}

el('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var t = el('pedido').value.trim();
  if (!t) { return; }
  el('pedido').value = '';
  var chave = entender(t);
  mostrar(chave, t);
});

renderChips(null);
</script>
</body>
</html>
